<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schedule Agent Developer Log · v2.3.13</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17202a;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:20px 14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#667085}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:16px;margin-top:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:1px solid #d0d5dd;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700}.log{background:#0b1220;color:#d7dee9;border-radius:10px;padding:12px;overflow:auto;max-height:75vh;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.row{padding:5px 0;border-bottom:1px solid #1e293b;white-space:pre-wrap}.error{color:#ffb4b4}.warn{color:#ffe49a}.ok{color:#b9f6ca}</style></head><body><main class="wrap"><header class="top"><div><div class="muted">CollegeSchedule · Developer</div><h1>Live Schedule Agent Log <small>v2.3.13</small></h1><p class="muted">Request trace: UI reachability and backend processing stages. Original documents are never stored in this log.</p></div><a href="agent.html">← Scheduler</a></header><section class="panel"><div class="toolbar"><button class="btn" id="refresh">Refresh now</button><label><input id="auto" type="checkbox" checked> Auto-refresh every 2s</label><span class="muted" id="state">Connecting…</span></div></section><section class="panel"><div id="log" class="log">Loading…</div></section></main><script src="supabase/config.js"></script><script>const cfg=window.COLLEGE_SCHEDULE_SUPABASE||{},logEl=document.getElementById('log'),state=document.getElementById('state'),auto=document.getElementById('auto');let timer=null;function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}async function load(){try{if(!cfg.url||!cfg.publishableKey)throw Error('Supabase configuration missing');const r=await fetch(cfg.url+'/rest/v1/rpc/get_schedule_agent_logs',{method:'POST',headers:{apikey:cfg.publishableKey,'Content-Type':'application/json'},body:JSON.stringify({p_limit:500})});const t=await r.text();if(!r.ok)throw Error('HTTP '+r.status+' '+t);const rows=JSON.parse(t);logEl.innerHTML=rows.length?rows.reverse().map(x=>{const cls=x.level==='error'?'error':x.level==='warn'?'warn':x.stage==='complete'?'ok':'';return '<div class="row '+cls+'">'+esc(new Date(x.created_at).toLocaleString())+'  ['+esc(x.level.toUpperCase())+'] ['+esc(x.stage)+'] '+esc(x.message)+'\nrequest='+esc(x.request_id)+'  '+esc(JSON.stringify(x.metadata||{}))+'</div>'}).join(''):'No log entries yet.';state.textContent='Live · '+rows.length+' entries · '+new Date().toLocaleTimeString()}catch(e){state.textContent='Logger error: '+e.message}}document.getElementById('refresh').onclick=load;auto.onchange=()=>{if(timer)clearInterval(timer);timer=auto.checked?setInterval(load,2000):null};load();timer=setInterval(load,2000);</script></body></html>
