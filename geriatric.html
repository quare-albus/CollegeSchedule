<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geriatric Data Entry</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#17202a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:980px;margin:auto;padding:20px 14px}.title{margin:0;font-size:36px}.sub{color:#667085}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin:16px 0}.rapid{width:100%;padding:18px;border:0;border-radius:14px;background:#2563eb;color:#fff;font-size:18px;font-weight:800;cursor:pointer}.rapid small{display:block;font-size:12px;font-weight:400;margin-top:3px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}label{font-size:13px;font-weight:700}input,select,textarea{font:inherit;padding:10px;border:1px solid #d0d5dd;border-radius:9px}textarea{min-height:75px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;font-weight:700;border:0;border-radius:9px;padding:10px 14px;cursor:pointer}.primary{background:#17202a;color:white}.secondary{background:#eef2f6}.danger{background:#fee4e2;color:#b42318}.records{overflow:auto}.records table{border-collapse:collapse;width:100%;font-size:12px}.records th,.records td{border:1px solid #ddd;padding:7px;white-space:nowrap}.records th{background:#f8fafc}
.overlay{display:none;position:fixed;inset:0;background:#101828aa;z-index:9999;align-items:center;justify-content:center;padding:10px}.overlay.show{display:flex}.modal{width:min(560px,100%);max-height:96vh;overflow:auto;background:#fff;border-radius:20px;padding:18px;box-shadow:0 20px 70px #0006}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}.close{background:#eef2f6}.progress{height:6px;background:#eaecf0;border-radius:99px;margin:14px 0}.progress i{display:block;height:100%;background:#2563eb;border-radius:99px;width:0}.step{font-size:12px;color:#667085}.question{font-size:25px;margin:7px 0 13px}.entry{width:100%;font-size:19px;padding:13px;border:1px solid #d0d5dd;border-radius:11px;background:#fff}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{background:#fff;border:1px solid #d0d5dd;padding:15px}.choice:hover{background:#eff6ff;border-color:#2563eb}.nav{display:flex;gap:9px;margin-top:12px}.nav button{flex:1}.hint{font-size:12px;color:#667085;margin-top:7px}.keyboard{margin-top:12px;padding:8px;background:#eef2f6;border-radius:14px;user-select:none}.kbrow{display:flex;gap:5px;margin:5px 0}.kbkey{flex:1;min-width:0;padding:12px 4px;background:#fff;border:1px solid #cfd4dc;border-radius:8px;font-size:16px;font-weight:700;touch-action:manipulation}.kbkey.wide{flex:1.6}.kbkey.space{flex:4}.kbkey.enter{background:#2563eb;color:#fff}.kbtop{display:flex;gap:5px;margin-bottom:5px}.kbtop button{padding:7px 10px}.kbtop .mode{flex:1;background:#fff;border:1px solid #cfd4dc}.kbtop .clear{background:#fee4e2;color:#b42318}.kbtop .caps{background:#fff;border:1px solid #cfd4dc}@media(max-width:600px){.wrap{padding:14px 10px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.question{font-size:22px}.modal{padding:14px}.kbkey{padding:11px 2px;font-size:15px}}
</style></head><body><main class="wrap">
<h1 class="title">Geriatric Data Entry</h1><p class="sub">Fast browser-only entry • data stays on this device</p>
<button class="rapid" id="rapidOpen" type="button">⚡ Rapid Entry<small>Enter one field at a time</small></button>
<div class="overlay" id="overlay"><div class="modal"><div class="modalhead"><h2>New patient</h2><button class="close" id="close" type="button">✕</button></div><div class="progress"><i id="prog"></i></div><div class="step" id="step"></div><div class="question" id="question"></div><div id="body"></div><div class="nav"><button class="secondary" id="back" type="button">Back</button><button class="primary" id="next" type="button">Next</button></div><div class="hint" id="hint">Tap the on-page keyboard</div><div class="keyboard" id="keyboard"></div></div></div>
<form id="form"><div class="panel"><h2>Patient details</h2><div class="grid">
<div class="field"><label>AGE</label><input id="age" type="number"></div><div class="field"><label>SEX</label><select id="sex"><option></option><option>Male</option><option>Female</option><option>Other</option></select></div>
<div class="field"><label>Date of admission</label><input id="admissionDate" placeholder="e.g. 01012025"></div><div class="field"><label>Time of admission</label><input id="admissionTime" placeholder="e.g. 0830"></div>
<div class="field"><label>Date of death</label><input id="deathDate" placeholder="e.g. 02012025"></div><div class="field"><label>Time of death</label><input id="deathTime" placeholder="e.g. 1430"></div>
<div class="field"><label>Admitting department</label><input id="department"></div><div class="field"><label>Referral status</label><select id="referral"><option></option><option>Direct</option><option>Referred</option><option>Transferred</option></select></div>
<div class="field"><label>Urban or rural</label><select id="area"><option></option><option>Urban</option><option>Rural</option></select></div>
<div class="field full"><label>Presenting complaints</label><textarea id="complaints"></textarea></div><div class="field full"><label>Existing comorbidities</label><textarea id="comorbidities"></textarea></div>
</div></div>
<div class="panel"><h2>Cause of death</h2><div class="grid">
<div class="field"><label>1a</label><input id="c1a"></div><div class="field"><label>1b</label><input id="c1b"></div><div class="field"><label>1c</label><input id="c1c"></div><div class="field"><label>Additional 1 (optional)</label><input id="c1extra"></div><div class="field"><label>2</label><input id="c2"></div><div class="field"><label>Additional 2 (optional)</label><input id="c2extra"></div>
</div></div>
<div class="panel"><h2>Record status</h2><div class="grid"><div class="field"><label>Complete or not</label><select id="complete"><option selected>Complete</option><option>Incomplete</option></select></div><div class="field"><label>PM done or not</label><select id="pm"><option selected>No</option><option>Yes</option></select></div><div class="field"><label>Death summary present or not</label><select id="summary"><option selected>Present</option><option>Not present</option></select></div></div></div>
<div class="panel"><div class="actions"><button class="primary" type="submit">Add patient to session</button><button class="secondary" type="button" id="download">Download Excel</button><button class="danger" type="button" id="clear">Clear session</button></div><p id="status">0 records</p></div></form>
<div class="panel"><h2>Current session</h2><div id="records">No records in this session.</div></div>
</main>
<script>
(function(){
const K='geriatricDataEntrySessionV1';let records=JSON.parse(localStorage.getItem(K)||'[]');let departmentOptions=[];const DEPARTMENT_SHEET='https://docs.google.com/spreadsheets/d/16vaqfxDUP9uMv-HOBQESSOMbn5Lu0S-yYoTOjs18CJ0/export?format=csv';
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(K,JSON.stringify(records));render()}
function render(){ $('status').textContent=records.length+' record'+(records.length===1?'':'s'); $('records').innerHTML=records.length?'<table><tr><th>#</th><th>Age</th><th>Sex</th><th>Admission</th><th>Death</th><th>Department</th><th>1</th><th>2</th></tr>'+records.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+r.age+'</td><td>'+r.sex+'</td><td>'+r.admissionDate+' '+r.admissionTime+'</td><td>'+r.deathDate+' '+r.deathTime+'</td><td>'+r.department+'</td><td>'+r.partI.join(' | ')+'</td><td>'+r.partII.join(' | ')+'</td></tr>').join('')+'</table>':'No records in this session.'}
const steps=[
 ['AGE','age','number'],['SEX','sex','choice',['Male','Female','Other']],['Date of admission','admissionDate','numericDate'],['Time of admission','admissionTime','numericTime'],['Date of death','deathDate','numericDate'],['Time of death','deathTime','numericTime'],['Admitting department','department','choice',departmentOptions],['Direct referred or transferred','referral','choice',['Direct','Referred','Transferred']],['Urban or rural','area','choice',['Urban','Rural']],['Presenting complaints','complaints','textarea'],['Existing comorbidities','comorbidities','textarea'],['Cause of death — 1a','c1a','text'],['Cause of death — 1b','c1b','text'],['Cause of death — 1c','c1c','text'],['Additional cause after 1c (optional)','c1extra','text'],['Cause of death — 2','c2','text'],['Additional condition after 2 (optional)','c2extra','text'],['Complete or not','complete','choice',['Complete','Incomplete'],'Complete'],['PM done or not','pm','choice',['No','Yes'],'No'],['Death summary present or not','summary','choice',['Present','Not present'],'Present']];
let idx=0,data={},active=null,shift=false,mode='abc';
const letters=[['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['z','x','c','v','b','n','m']];
const nums=[['1','2','3'],['4','5','6'],['7','8','9'],['0']];
function setActive(el){active=el;renderKeyboard();setTimeout(()=>el.scrollIntoView({block:'nearest',behavior:'smooth'}),10)}
function insert(t){if(!active)return;const start=active.selectionStart??active.value.length,end=active.selectionEnd??active.value.length;active.value=active.value.slice(0,start)+t+active.value.slice(end);active.selectionStart=active.selectionEnd=start+t.length;active.dispatchEvent(new Event('input',{bubbles:true}))}
function backspace(){if(!active)return;const p=active.selectionStart??active.value.length,q=active.selectionEnd??p;if(p!==q){active.value=active.value.slice(0,p)+active.value.slice(q);active.selectionStart=active.selectionEnd=p}else if(p>0){active.value=active.value.slice(0,p-1)+active.value.slice(p);active.selectionStart=active.selectionEnd=p-1}active.dispatchEvent(new Event('input',{bubbles:true}))}
function renderKeyboard(){const k=$('keyboard');k.innerHTML='';if(!active){k.innerHTML='<div class="hint">Choose a text field to use the on-page keyboard.</div>';return}
const s=steps[idx],numeric=s[2]==='number'||s[2]==='numericDate'||s[2]==='numericTime';if(numeric)mode='num';
const top=document.createElement('div');top.className='kbtop';
if(!numeric){const m=document.createElement('button');m.className='mode';m.type='button';m.textContent=mode==='abc'?'ABC keyboard':'123 keyboard';m.onclick=()=>{mode=mode==='abc'?'num':'abc';renderKeyboard()};top.appendChild(m);if(mode==='abc'){const c=document.createElement('button');c.className='caps';c.type='button';c.textContent=shift?'ABC':'abc';c.onclick=()=>{shift=!shift;renderKeyboard()};top.appendChild(c)}}else{const label=document.createElement('button');label.className='mode';label.type='button';label.textContent='123 keyboard';label.disabled=true;top.appendChild(label)}
const clr=document.createElement('button');clr.className='clear';clr.type='button';clr.textContent='Clear';clr.onclick=()=>{active.value='';active.dispatchEvent(new Event('input',{bubbles:true}))};top.appendChild(clr);k.appendChild(top);
const rows=numeric?nums:(mode==='abc'?letters:nums);rows.forEach(row=>{const r=document.createElement('div');r.className='kbrow';row.forEach(ch=>{const b=document.createElement('button');b.className='kbkey';b.type='button';b.textContent=shift&&mode==='abc'&&!numeric?ch.toUpperCase():ch;b.onclick=()=>{if((s[2]==='number'||s[2]==='numericDate'||s[2]==='numericTime')&&active.value.length>=(s[2]==='number'?3:s[2]==='numericDate'?8:4))return;insert(shift&&mode==='abc'&&!numeric?ch.toUpperCase():ch)};r.appendChild(b)});k.appendChild(r)});
const bottom=document.createElement('div');bottom.className='kbrow';
[['⌫',null,'wide'],['↵ Next',null,'enter']].forEach(([txt,val,cl])=>{const b=document.createElement('button');b.className='kbkey '+cl;b.type='button';b.textContent=txt;b.onclick=()=>{if(txt==='⌫')backspace();else next()};bottom.appendChild(b)});k.appendChild(bottom)}
async function loadDepartments(){try{const r=await fetch(DEPARTMENT_SHEET,{cache:'no-store'});if(!r.ok)return;const t=await r.text();const lines=t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const list=[...new Set(lines.slice(1).map(x=>{let v=x.split(',')[0].trim();if(v.startsWith('"')&&v.endsWith('"'))v=v.slice(1,-1).replace(/""/g,'"');return v}).filter(Boolean))];if(list.length)departmentOptions=list;steps[6][3]=departmentOptions}catch(e){steps[6][3]=departmentOptions}}
$('rapidOpen').onclick=()=>{steps[6][3]=departmentOptions;idx=0;data={};active=null;mode='abc';shift=false;$('overlay').classList.add('show');draw();loadDepartments().then(()=>{steps[6][3]=departmentOptions})};
$('close').onclick=()=>$('overlay').classList.remove('show');$('overlay').onclick=e=>{if(e.target===e.currentTarget)$('overlay').classList.remove('show')};
function draw(){const s=steps[idx],v=data[s[1]]??s[4]??'';$('step').textContent='Patient '+(records.length+1)+' • '+(idx+1)+' / '+steps.length;$('prog').style.width=((idx+1)/steps.length*100)+'%';$('question').textContent=s[0];$('body').innerHTML='';$('hint').textContent=s[2]==='choice'?'Tap an option':(s[2]==='numericDate'?'Numbers only • DDMMYYYY':s[2]==='numericTime'?'Numbers only • HHMM':s[2]==='number'?'Numbers only':'Use the keyboard below');
if(s[2]==='choice'){const box=document.createElement('div');box.className='choices';s[3].forEach(o=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=o;b.onclick=()=>{data[s[1]]=o;if(idx===steps.length-1)finish();else{idx++;active=null;draw()}};box.appendChild(b)});$('body').appendChild(box);active=null}
else{const e=document.createElement(s[2]==='textarea'?'textarea':'input');e.className='entry';e.type='text';e.inputMode='none';e.readOnly=true;e.value=v;e.placeholder=s[0].includes('optional')?'Optional':s[2]==='numericDate'?'e.g. 01012025':s[2]==='numericTime'?'e.g. 0830':s[2]==='number'?'e.g. 72':'Tap keyboard below';e.onfocus=()=>setActive(e);e.onclick=()=>setActive(e);e.oninput=()=>data[s[1]]=e.value;$('body').appendChild(e);setActive(e)}
$('back').disabled=idx===0;$('back').style.opacity=idx===0?.4:1;$('next').textContent=idx===steps.length-1?'Save patient':'Next';renderKeyboard()}
function next(){const s=steps[idx],e=$('body').querySelector('input,textarea');if(e){data[s[1]]=e.value.trim();active=e}if(!data[s[1]]&&s[4])data[s[1]]=s[4];if(idx<steps.length-1){idx++;active=null;draw()}else finish()}
$('next').onclick=next;$('back').onclick=()=>{if(idx>0){idx--;active=null;draw()}};
function finish(){records.push({age:data.age||'',sex:data.sex||'',admissionDate:data.admissionDate||'',admissionTime:data.admissionTime||'',deathDate:data.deathDate||'',deathTime:data.deathTime||'',department:data.department||'',referral:data.referral||'',area:data.area||'',complaints:data.complaints||'',comorbidities:data.comorbidities||'',partI:[data.c1a,data.c1b,data.c1c,data.c1extra].filter(Boolean),partII:[data.c2,data.c2extra].filter(Boolean),complete:data.complete||'Complete',pm:data.pm||'No',summary:data.summary||'Present'});save();$('overlay').classList.remove('show')}
$('form').onsubmit=e=>e.preventDefault();$('clear').onclick=()=>{if(confirm('Clear all records?')){records=[];save()}};
$('download').onclick=()=>{if(!records.length)return alert('Add at least one patient first.');const h=['AGE','SEX','DATE OF ADMISSION','TIME OF ADMISSION','DATE OF DEATH','TIME OF DEATH','ADMITTING DEPARTMENT','DIRECT REFERRED OR TRANSFERRED','URBAN OR RURAL','PRESENTING COMPLAINTS','EXISTING COMORBIDITIES','1A','1B','1C','ADDITIONAL 1','2','ADDITIONAL 2','COMPLETE OR NOT','PM DONE OR NOT','DEATH SUMMARY PRESENT OR NOT'];const esc=x=>String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const rows=records.map(r=>[r.age,r.sex,r.admissionDate,r.admissionTime,r.deathDate,r.deathTime,r.department,r.referral,r.area,r.complaints,r.comorbidities,r.partI[0]||'',r.partI[1]||'',r.partI[2]||'',r.partI.slice(3).join(' | '),r.partII[0]||'',r.partII.slice(1).join(' | '),r.complete,r.pm,r.summary]);const xml='<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Geriatric Data"><Table><Row>'+h.map(x=>'<Cell><Data ss:Type="String">'+esc(x)+'</Data></Cell>').join('')+'</Row>'+rows.map(row=>'<Row>'+row.map(x=>'<Cell><Data ss:Type="String">'+esc(x)+'</Data></Cell>').join('')+'</Row>').join('')+'</Table></Worksheet></Workbook>';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([xml],{type:'application/vnd.ms-excel'}));a.download='geriatric_session.xls';a.click()};
render();
})();
</script></body></html>
