<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CollegeSchedule · Sign in</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{font-family:system-ui,sans-serif;color:#17202a;background:#f6f7f9}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:28px;box-shadow:0 8px 30px #0001}.muted{color:#667085}.btn{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;font:inherit;font-weight:700;cursor:pointer}.primary{background:#17202a;color:#fff;margin-top:10px}.hidden{display:none}.status{margin:14px 0;padding:10px;border:1px solid #e4e7ec;border-radius:10px;background:#f9fafb}.error{background:#fff6f6;border-color:#f2c4c4;color:#9b1c1c}input{width:100%;box-sizing:border-box;padding:12px;margin-top:8px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}</style></head><body><main class="card"><h1>CollegeSchedule</h1><p class="muted">Student attendance</p><section id="out"><p class="muted">Sign in with your college Google account.</p><button id="google" class="btn">Continue with Google</button></section><section id="in" class="hidden"><p id="identity" class="muted"></p><label for="roll">Roll number</label><input id="roll" inputmode="numeric" maxlength="30" placeholder="Enter roll number"><button id="save" class="btn primary">Save & continue</button><button id="logout" class="btn" style="margin-top:10px">Sign out</button></section><div id="status" class="status">Starting sign-in check…</div></main><script src="supabase/config.js"></script><script>
const cfg=window.COLLEGE_SCHEDULE_SUPABASE||{};
const sb=supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,lock:async(_name,_timeout,fn)=>fn()}});
const out=document.getElementById('out'),inside=document.getElementById('in'),status=document.getElementById('status'),identity=document.getElementById('identity'),roll=document.getElementById('roll');
let busy=false;
function message(text,error=false){status.textContent=text;status.className='status'+(error?' error':'');}
function signedOut(text='Not signed in.'){out.classList.remove('hidden');inside.classList.add('hidden');message(text);}
function withTimeout(promise,ms,label){return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label+' timed out after '+ms/1000+' seconds')),ms))]);}
async function load(){if(busy)return;busy=true;message('Checking sign-in status…');try{const result=await withTimeout(sb.auth.getSession(),8000,'Session check');if(result.error)throw result.error;const session=result.data?.session;if(!session){signedOut();return}out.classList.add('hidden');inside.classList.remove('hidden');identity.textContent=session.user.email||'Signed in with Google';const profile=await withTimeout(sb.from('users').select('roll_no').eq('id',session.user.id).maybeSingle(),8000,'Profile lookup');if(profile.error)throw profile.error;roll.value=profile.data?.roll_no||'';message(profile.data?.roll_no?'Signed in.':'Enter your roll number.');}catch(e){message('Sign-in check failed: '+(e.message||e),true);}finally{busy=false;}}
document.getElementById('google').onclick=async()=>{message('Opening Google…');const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:'https://quare-albus.github.io/CollegeSchedule/auth.html'}});if(error)message(error.message,true);};
document.getElementById('save').onclick=async()=>{const value=roll.value.trim();if(!value){message('Please enter your roll number.',true);return;}try{const session=await withTimeout(sb.auth.getSession(),8000,'Session check');const user=session.data?.session?.user;if(!user)throw new Error('Session expired');const result=await withTimeout(sb.from('users').upsert({id:user.id,roll_no:value},{onConflict:'id'}),8000,'Profile save');if(result.error)throw result.error;message('Saved. Opening timetable…');location.href='index.html';}catch(e){message('Could not save: '+(e.message||e),true);}};
document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();signedOut();};
sb.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT')signedOut();else if(['SIGNED_IN','INITIAL_SESSION','TOKEN_REFRESHED'].includes(event))setTimeout(load,0);});
setTimeout(load,0);
</script></body></html>
